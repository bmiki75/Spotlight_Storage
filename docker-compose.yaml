services:
  spotlight-storage:
    environment:
      - TRANSLATIONS_DIR=/app/static/translations
    image: bmik75/spotlight_storage
    ports:
      - "5010:5010"
    restart: on-failure
    volumes:
      - ./data:/app/data
      - ./images:/app/images
      - ./logs:/app/logs
      - ./static/translations:/app/static/translations:ro
